<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講師收件管理｜提示詞機器人</title><link rel="stylesheet" href="assets/training.css"><script defer src="assets/vendor/fflate.min.js"></script><script defer src="assets/training-common.js"></script><script defer src="assets/training-admin.js"></script></head>
<body><header class="site-header"><a class="brand" href="index.html">提示詞機器人</a><nav class="header-links" aria-label="主要導覽"><a href="submit.html">學員交件</a><a href="index.html">教學工作台</a></nav></header><main class="page"><h1>講師收件管理</h1><p class="lead">開放活動、發放帳號，並在這裡收齊學員的圖片作品。</p><div id="status" class="status" role="status" aria-live="polite"></div>
<section id="login-section" class="panel login-panel" hidden><h2>講師登入</h2><form id="login-form" class="stack"><label>管理密碼<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">登入管理</button><p class="quiet">使用主辦方設定的共用管理密碼。</p></form></section>
<section id="admin-section" hidden><div class="admin-bar"><label>目前活動<select id="activity-select"></select></label><div class="row"><button id="toggle-activity" class="secondary" type="button">開放交件</button><button id="refresh" class="secondary" type="button">重新整理</button><button id="logout" class="secondary" type="button">登出</button></div></div><p id="activity-summary" class="activity-summary"></p><p id="storage" class="quiet"></p>
<div class="tabs" role="tablist" aria-label="管理功能"><button id="tab-submissions" role="tab" aria-controls="submissions-section" aria-selected="true">圖片收件</button><button id="tab-accounts" role="tab" aria-controls="accounts-section" aria-selected="false" tabindex="-1">學員帳號</button></div>
<section id="submissions-section" role="tabpanel" aria-labelledby="tab-submissions"><form id="search-form" class="row"><label for="query" class="sr-only">搜尋姓名、組別或帳號</label><input id="query" type="search" placeholder="搜尋姓名、組別或帳號" maxlength="80"><button class="secondary" type="submit">搜尋</button></form><div class="row section-gap"><button id="download-zip" type="button">下載全部圖片 ZIP</button><button id="download-csv" class="secondary" type="button">下載交件清單 CSV</button></div><p class="quiet notice">批次下載包含目前活動的所有作品，不受搜尋條件影響。</p><div class="table-wrap"><table><thead><tr><th scope="col">姓名／帳號</th><th scope="col">組別</th><th scope="col">最新交件</th><th scope="col">圖片</th></tr></thead><tbody id="submissions-body"></tbody></table></div></section>
<section id="accounts-section" role="tabpanel" aria-labelledby="tab-accounts" hidden><form id="generate-form" class="row"><label>新增帳號數量<input name="count" type="number" min="1" max="100" value="50" required></label><button type="submit">產生帳號與密碼</button></form><p class="notice">密碼只在建立或重設後顯示一次，請立即下載並妥善發放。重設密碼會登出該學員。</p><div id="credentials" class="credentials" hidden><p id="credential-message"></p><button id="download-credentials" type="button">下載這批帳密 CSV</button><button id="dismiss-credentials" class="secondary" type="button">已保存，清除畫面</button></div><div class="table-wrap"><table><thead><tr><th scope="col">帳號</th><th scope="col">姓名</th><th scope="col">組別</th><th scope="col">狀態</th><th scope="col">操作</th></tr></thead><tbody id="accounts-body"></tbody></table></div></section>
<details class="section-gap"><summary>新增下一場活動</summary><form id="activity-form" class="stack"><label>活動名稱<input name="name" required maxlength="80"></label><label>活動代碼<input name="code" required minlength="4" maxlength="32" pattern="[A-Za-z0-9-]{4,32}" placeholder="例如 TRAIN1118" spellcheck="false"><small>4–32 個英文字母、數字或連字號。</small></label><button type="submit">建立活動</button></form></details>
<details><summary>匯出後整理活動作品</summary><p class="notice">請先下載圖片和清單。刪除會清空這場活動的作品，保留學員帳號；活動必須先截止。</p><form id="delete-form" class="row"><label>輸入目前活動代碼以確認<input name="confirmCode" required maxlength="32" autocomplete="off"></label><button type="submit" class="danger">刪除此活動全部作品</button></form></details></section>
<dialog id="image-dialog" aria-labelledby="image-title"><div class="row spread"><h2 id="image-title">學員作品</h2><button id="close-dialog" class="secondary" type="button">關閉</button></div><img id="dialog-image" class="preview" alt="學員已交作品"></dialog></main><footer>作品只供登入的講師查看。請妥善保管管理密碼、學員帳密及下載的作品。</footer></body></html>
